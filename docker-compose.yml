services:
  comrun-java:
    build: ./comrun-java
    # Batch grading (/api/upload) is reached container-to-container over
    # codecheck-internal. The loopback port below is published ONLY so the
    # host's cloudflared can expose the interactive /run/java + /run/java/ws
    # routes for Quarto lecture slides — bound to 127.0.0.1, never the LAN.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - codecheck-internal
      - default
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped

  codecheck-webapp:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8080:8080"   # bind to loopback only; cloudflared connects locally
    networks:
      - codecheck-internal
      - default
    volumes:
      # Bind-mounted so problems + assignments + submissions persist across
      # container restarts/rebuilds and can be backed up as a plain folder.
      # Relative path: resolved against this compose file's own directory,
      # so it needs no hardcoded username or $HOME expansion.
      - ./codecheck-data:/data/codecheck
    environment:
      COM_HORSTMANN_CODECHECK_COMRUN_REMOTE: http://comrun-java:8080/api/upload
      # The default storage path (/opt/codecheck/repo) isn't writable by the
      # non-root `javauser` the image runs as (Dockerfile.jvm), so point it
      # at the bind-mounted volume above instead.
      COM_HORSTMANN_CODECHECK_STORAGE_LOCAL: /data/codecheck/repo
      # Enables POST /deleteProblems batch delete (X-Admin-Password header).
      # Value comes from the gitignored .env file next to this compose file;
      # leave it empty there to disable the feature.
      COM_HORSTMANN_CODECHECK_ADMIN_PASSWORD: ${COM_HORSTMANN_CODECHECK_ADMIN_PASSWORD:-}
    depends_on:
      - comrun-java
    restart: unless-stopped

networks:
  codecheck-internal:
    internal: true   # no route out to the internet or the host's LAN
  default:
