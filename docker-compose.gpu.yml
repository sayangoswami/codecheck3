# Second, self-contained CodeCheck instance for a GPU (numba-cuda / CuPy)
# course. Runs alongside the main docker-compose.yml without touching it:
# its own webapp, its own comrun, its own storage volume, its own loopback
# port and cloudflared hostname.
#
#   podman-compose -f docker-compose.gpu.yml up -d --build
#
# Use `podman-compose` (standalone), NOT `podman compose` — the latter's
# docker-compose backend mangles the `nvidia.com/gpu=all` CDI device name.
#
# See DEPLOYMENT.md → "Appendix: a GPU instance for numba-cuda / CuPy" for
# the NVIDIA container-toolkit / CDI setup this depends on.

services:
  comrun-gpu:
    build:
      context: .
      dockerfile: comrun-gpu/Dockerfile
    # CDI device injected by the NVIDIA container toolkit. Host needs
    # `nvidia-ctk cdi generate --cdi-version=0.6.0` (0.7.0 is unparseable by
    # podman < 5.0) — see DEPLOYMENT.md. Honoured by `podman-compose`, NOT by
    # `podman compose`.
    devices:
      - nvidia.com/gpu=all
    environment:
      # One class submitting at once must not spawn dozens of CUDA contexts.
      # Each in-flight job ≈ one python process ≈ one CUDA context
      # (~300-600 MB VRAM before any data). Card has ~20 GB, so ~3-6 is safe,
      # but serialized to 1 to keep execution fully sequential.
      # queue-wait + job-run must stay under the webapp's 90s HTTP timeout.
      COMRUN_MAX_CONCURRENCY: "1"
      COMRUN_MAX_QUEUE: "30"
      COMRUN_QUEUE_TIMEOUT_MS: "45000"
      COMRUN_JOB_TIMEOUT_MS: "75000"
    networks:
      - codecheck-gpu-internal
    # Host RAM cap (NOT GPU VRAM — that needs MPS/MIG, out of scope here).
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 512
    # NOTE: unlike comrun-java, this image can't use `cap_drop: ALL` /
    # `no-new-privileges` — the comrun engine uses sudo to drop to the
    # `comrunner` user. Isolation here is the OS user + these resource caps.
    restart: unless-stopped

  codecheck-webapp-gpu:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8082:8080"   # loopback only; cloudflared connects locally
    networks:
      - codecheck-gpu-internal
      - default
    volumes:
      - ./codecheck-gpu-data:/data/codecheck
    environment:
      COM_HORSTMANN_CODECHECK_COMRUN_REMOTE: http://comrun-gpu:8080/api/upload
      COM_HORSTMANN_CODECHECK_STORAGE_LOCAL: /data/codecheck/repo
      # If the main instance sets a JWT secret / other prod config, mirror the
      # ones you need here (kept out of git in application-prod.properties).
    depends_on:
      - comrun-gpu
    restart: unless-stopped

networks:
  codecheck-gpu-internal:
    internal: true
  default:
