com.horstmann.codecheck.storage.local=/opt/codecheck/repo
com.horstmann.codecheck.comrun.local=/opt/codecheck/comrun
com.horstmann.codecheck.comrun.remote=https://comrun-java-production.up.railway.app/api/upload
com.horstmann.codecheck.jwt.secret.key=changeme
# Set (in application-prod.properties) to enable POST /deleteProblems batch
# problem deletion, authorised by the X-Admin-Password header. Unset = disabled.
# com.horstmann.codecheck.admin.password=
# Comma-separated printf patterns (%s = problem id) for resolving assignment
# problems given by bare id instead of full URL. Unset = bare ids rejected.
# Must be the public origin - the URL is loaded as an iframe src in the browser.
# com.horstmann.codecheck.qid.patterns=https://codecheck.example.com/files/%s
com.horstmann.codecheck.home=assets/uploadProblem.html

quarkus.http.port=8080
quarkus.index-dependency.resteasy-multipart.group-id=org.jboss.resteasy
quarkus.index-dependency.resteasy-multipart.artifact-id=resteasy-multipart-provider

